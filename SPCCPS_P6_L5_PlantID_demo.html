<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101610">
  <title>植物辨識 · SPCCPS P6 第五課（示範）</title>
  <style>
    :root {
      --bg: #101610;
      --card: #1c2620;
      --elev: #26342c;
      --text: #f4fff6;
      --muted: #a9bdb0;
      --green: #30d158;
      --green-ink: #062113;
      --blue: #0a84ff;
      --red: #ff6b6b;
      --amber: #ffd60a;
      --line: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: #070b08;
      color: var(--text);
      font-family: "PingFang HK", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    h1, h2, p { margin: 0; }

    .app {
      width: min(420px, 100%);
      height: min(880px, calc(100dvh - 48px));
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    header { padding: calc(16px + env(safe-area-inset-top)) 16px 8px; }
    .eyebrow { color: var(--muted); font-size: 13px; font-weight: 650; }
    h1 { font-size: 32px; letter-spacing: -0.03em; }
    .banner {
      margin-top: 8px;
      background: rgba(48, 209, 88, 0.14);
      color: var(--green);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.4;
    }

    main { flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 16px; }

    .frame {
      height: 220px;
      border-radius: 18px;
      background: #0c140f;
      border: 1px dashed rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .frame svg, .frame img { width: 100%; height: 100%; object-fit: cover; }
    .frame p { color: var(--muted); padding: 0 24px; text-align: center; line-height: 1.5; }

    .actions { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn {
      border: 0;
      border-radius: 14px;
      min-height: 48px;
      padding: 0 14px;
      font-size: 16px;
      font-weight: 750;
    }
    .btn.green { background: var(--green); color: var(--green-ink); flex: 1; }
    .btn.blue { background: var(--blue); color: white; width: 100%; }
    .btn.ghost { background: var(--elev); color: white; }
    .btn:disabled { opacity: 0.45; cursor: default; }

    .samples { display: flex; gap: 8px; overflow: auto; padding-bottom: 8px; margin-bottom: 8px; }
    .sample {
      flex: none;
      width: 76px;
      border: 0;
      border-radius: 12px;
      background: var(--card);
      color: white;
      padding: 6px;
    }
    .sample svg { width: 64px; height: 48px; display: block; border-radius: 8px; }
    .sample span { display: block; margin-top: 4px; font-size: 11px; font-weight: 700; }
    .sample[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--green); }

    .result {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      margin-top: 6px;
    }
    .result h2 { font-size: 28px; letter-spacing: -0.03em; }
    .en { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .conf { margin-top: 10px; font-size: 22px; font-weight: 800; }
    .bar { height: 8px; border-radius: 99px; background: var(--elev); margin-top: 6px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--green); width: 0; }
    .uncertain h2, .unknown h2 { color: var(--amber); }
    .unknown h2 { color: var(--red); }
    .note { margin-top: 8px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .rank { margin: 10px 0 0; padding: 0; list-style: none; }
    .rank li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .tip { margin-top: 10px; background: var(--elev); border-radius: 12px; padding: 10px 12px; line-height: 1.5; }
    .tip b { display: block; margin-bottom: 4px; }
    .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

    details { margin-top: 10px; }
    summary { cursor: pointer; color: var(--muted); font-size: 14px; }
    pre {
      margin: 8px 0 0;
      background: #0c140f;
      border-radius: 10px;
      padding: 10px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
    }

    .diary-item {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .diary-item div { flex: 1; min-width: 0; }
    .diary-item b { display: block; font-size: 17px; }
    .diary-item span { color: var(--muted); font-size: 13px; }
    .empty { text-align: center; color: var(--muted); padding: 36px 12px; line-height: 1.5; }

    .tabs {
      flex: none;
      display: flex;
      border-top: 0.5px solid var(--line);
      background: #18211c;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 12px 0 10px;
      font-size: 15px;
      font-weight: 650;
    }
    .tab[aria-selected="true"] { color: var(--green); font-weight: 800; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

    @media (max-width: 560px) {
      body { display: block; padding: 0; background: var(--bg); }
      .app { width: 100%; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <p class="eyebrow">小六 · 第五課</p>
      <h1>植物辨識</h1>
      <p class="banner">示範辨識 · 不是 Create ML，也不會呼叫付費 API</p>
    </header>
    <main id="main"></main>
    <nav class="tabs" role="tablist" aria-label="功能">
      <button type="button" class="tab" id="tab-id" data-tab="identify" aria-selected="true">辨識</button>
      <button type="button" class="tab" id="tab-diary" data-tab="diary" aria-selected="false">日記</button>
    </nav>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
  <noscript><p>請啟用 JavaScript 以使用植物辨識示範。</p></noscript>
  <script>
    var DIARY_KEY = "spccps-p6-l5-plant-diary-v1";
    var PLANTS = {
      Rose: { zh: "玫瑰", tip: "每天要有陽光。泥土表面乾了才淋水，不要淋在花朵上。" },
      Tulip: { zh: "鬱金香", tip: "喜歡清涼。球莖不要長期浸水，否則會爛。" },
      Sunflower: { zh: "向日葵", tip: "需要很多陽光。泥土保持微濕，花盆要穩，植株會長得高。" }
    };

    function svgRose(dim) {
      var bloom = dim ? "#8e3a44" : "#e23d4a";
      var bg = dim ? "#14181c" : "#163026";
      return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="160" fill="' + bg + '"/><rect x="96" y="78" width="8" height="70" fill="#1f8a4c"/><circle cx="100" cy="72" r="28" fill="' + bloom + '"/><circle cx="84" cy="66" r="16" fill="#ff8b94"/><circle cx="114" cy="68" r="14" fill="#c81e3a"/><circle cx="100" cy="78" r="10" fill="#ffd0d4"/></svg>';
    }
    function svgTulip() {
      return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="160" fill="#143024"/><rect x="96" y="70" width="8" height="78" fill="#2f9e55"/><path d="M70 78c10-40 50-40 60 0-18-8-42-8-60 0z" fill="#ff5fa2"/><path d="M78 40c8 16 14 28 22 36 8-8 14-20 22-36-12 6-32 6-44 0z" fill="#ffd1e6"/></svg>';
    }
    function svgSun(far) {
      var y = far ? 28 : 54;
      var r = far ? 16 : 34;
      return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="160" fill="#1a3318"/><rect x="97" y="' + (y + r) + '" width="6" height="' + (150 - y - r) + '" fill="#3c8f32"/><g fill="#f5c518"><circle cx="100" cy="' + y + '" r="' + (r + 14) + '"/></g><circle cx="100" cy="' + y + '" r="' + r + '" fill="#8a4b12"/></svg>';
    }
    function svgLeaf() {
      return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="160" fill="#102016"/><path d="M40 100 C70 20 150 20 170 70 C120 60 70 80 40 100Z" fill="#3cb371"/><path d="M48 96 C90 70 130 60 164 72" fill="none" stroke="#0e3b24" stroke-width="3"/></svg>';
    }
    function svgCat() {
      return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="160" fill="#2a241c"/><path d="M55 70 L70 38 L88 70" fill="#e8a05a"/><path d="M112 70 L130 38 L145 70" fill="#e8a05a"/><ellipse cx="100" cy="96" rx="52" ry="40" fill="#f0b56a"/><circle cx="82" cy="92" r="6" fill="#1c1c1e"/><circle cx="118" cy="92" r="6" fill="#1c1c1e"/><path d="M94 104 h12 l-6 8z" fill="#e07a8a"/></svg>';
    }
    function svgBag() {
      return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="160" fill="#1b2430"/><path d="M70 58 h60 v10 h-60z" fill="none" stroke="#d7dde8" stroke-width="6"/><rect x="58" y="66" width="84" height="62" rx="8" fill="#3d6ea8"/><rect x="86" y="84" width="28" height="16" rx="3" fill="#f2c14e"/></svg>';
    }
    function svgHand() {
      return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="160" fill="#2a211c"/><rect x="88" y="78" width="24" height="58" rx="10" fill="#f0c2a0"/><rect x="60" y="48" width="18" height="58" rx="9" fill="#f0c2a0"/><rect x="80" y="36" width="18" height="66" rx="9" fill="#e7b292"/><rect x="100" y="40" width="18" height="62" rx="9" fill="#f0c2a0"/><rect x="120" y="52" width="18" height="50" rx="9" fill="#e7b292"/></svg>';
    }

    var SAMPLES = [
      { id: "rose", title: "玫瑰", fileName: "rose-close.svg", kind: "plant", svg: svgRose(false), scores: [["Rose", 0.92], ["Tulip", 0.05], ["Sunflower", 0.03]] },
      { id: "tulip", title: "鬱金香", fileName: "tulip.svg", kind: "plant", svg: svgTulip(), scores: [["Tulip", 0.88], ["Rose", 0.08], ["Sunflower", 0.04]] },
      { id: "sun", title: "向日葵", fileName: "sunflower.svg", kind: "plant", svg: svgSun(false), scores: [["Sunflower", 0.95], ["Rose", 0.03], ["Tulip", 0.02]] },
      { id: "rose-dim", title: "暗光玫瑰", fileName: "rose-dark.svg", kind: "plant", svg: svgRose(true), scores: [["Rose", 0.61], ["Tulip", 0.27], ["Sunflower", 0.12]] },
      { id: "far", title: "遠距離", fileName: "sunflower-far.svg", kind: "uncertain", svg: svgSun(true), scores: [["Sunflower", 0.48], ["Rose", 0.31], ["Tulip", 0.21]] },
      { id: "leaf", title: "只影葉", fileName: "leaf.svg", kind: "uncertain", svg: svgLeaf(), scores: [["Rose", 0.4], ["Tulip", 0.35], ["Sunflower", 0.25]] },
      { id: "cat", title: "貓", fileName: "cat.svg", kind: "trap", svg: svgCat(), scores: [] },
      { id: "bag", title: "書包", fileName: "bag.svg", kind: "trap", svg: svgBag(), scores: [] },
      { id: "hand", title: "手", fileName: "hand.svg", kind: "trap", svg: svgHand(), scores: [] }
    ];

    var state = {
      tab: "identify",
      sampleId: null,
      photoHtml: "",
      photoUrl: "",
      result: null,
      savedNote: ""
    };
    var diary = [];

    function hashString(text) {
      var h = 2166136261;
      for (var i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function percents(scores) {
      if (!scores.length) return [];
      var raw = scores.map(function (row) { return Math.round(row[1] * 100); });
      var sum = raw.reduce(function (a, b) { return a + b; }, 0);
      raw[0] += 100 - sum;
      return raw;
    }

    function judge(scores, kind) {
      if (kind === "trap" || !scores.length) return { status: "unknown", scores: [] };
      var sorted = scores.slice().sort(function (a, b) { return b[1] - a[1]; });
      var status = sorted[0][1] >= 0.55 ? "ok" : "uncertain";
      if (kind === "uncertain") status = "uncertain";
      return { status: status, scores: sorted };
    }

    function resultFromSample(sample, fileName) {
      var judged = judge(sample.scores, sample.kind);
      judged.fileName = fileName || sample.fileName;
      return judged;
    }

    function classifyName(fileName, size) {
      var name = String(fileName || "").toLowerCase();
      if (/cat|kitty|dog|bag|hand|face|貓|狗|書包/.test(name) || /(^|[^a-z])hand([^a-z]|$)/.test(name)) {
        return { status: "unknown", scores: [], fileName: fileName };
      }
      if (/leaf|葉/.test(name)) {
        return resultFromSample(SAMPLES.filter(function (s) { return s.id === "leaf"; })[0], fileName);
      }
      var named = null;
      if (/rose|玫瑰/.test(name)) named = "rose";
      else if (/tulip|鬱金香|郁金香/.test(name)) named = "tulip";
      else if (/sunflower|向日葵/.test(name)) named = "sun";
      if (named) return resultFromSample(SAMPLES.filter(function (s) { return s.id === named; })[0], fileName);
      var h = hashString(name + "|" + String(size || 0));
      var labels = ["Rose", "Tulip", "Sunflower"];
      var topLabel = labels[h % 3];
      var rest = labels.filter(function (label) { return label !== topLabel; });
      if (h % 11 === 0) {
        return {
          status: "uncertain",
          fileName: fileName,
          scores: [[topLabel, 0.46], [rest[0], 0.3], [rest[1], 0.24]]
        };
      }
      var top = 0.72 + (h % 20) / 100;
      var remain = 1 - top;
      var second = remain * 0.72;
      return {
        status: "ok",
        fileName: fileName,
        scores: [[topLabel, top], [rest[h % 2], second], [rest[1 - (h % 2)], remain - second]]
      };
    }

    function loadDiary() {
      try {
        var raw = JSON.parse(localStorage.getItem(DIARY_KEY) || "[]");
        diary = Array.isArray(raw) ? raw.filter(function (item) { return item && item.label; }) : [];
      } catch (err) {
        diary = [];
      }
    }

    function saveDiary() {
      try { localStorage.setItem(DIARY_KEY, JSON.stringify(diary.slice(0, 30))); } catch (err) {}
    }

    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(function (key) {
          var value = attrs[key];
          if (value == null || value === false) return;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key === "html") node.innerHTML = value;
          else node.setAttribute(key, value === true ? "" : String(value));
        });
      }
      (children || []).forEach(function (child) {
        if (child == null || child === false) return;
        node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
      });
      return node;
    }

    function displayName(result) {
      if (!result || result.status === "unknown") return { zh: "認不到", en: "不是學過的植物" };
      if (result.status === "uncertain") return { zh: "不確定", en: result.scores.length ? PLANTS[result.scores[0][0]].zh : "" };
      var plant = PLANTS[result.scores[0][0]];
      return { zh: plant.zh, en: result.scores[0][0] };
    }

    function paintIdentify() {
      var main = document.getElementById("main");
      main.textContent = "";
      var frame = el("div", { class: "frame", id: "frame" });
      if (state.photoHtml) frame.innerHTML = state.photoHtml;
      else if (state.photoUrl) frame.appendChild(el("img", { src: state.photoUrl, alt: "已選擇的相片" }));
      else frame.appendChild(el("p", { text: "尚未選擇相片。按綠色按鈕從相簿揀相，或點下面的示範相片。" }));
      main.appendChild(frame);

      var actions = el("div", { class: "actions" });
      actions.appendChild(el("button", { type: "button", class: "btn green", id: "pick", text: "揀相" }));
      main.appendChild(actions);

      var strip = el("div", { class: "samples", "aria-label": "示範相片" });
      SAMPLES.forEach(function (sample) {
        var button = el("button", {
          type: "button",
          class: "sample",
          "data-sample": sample.id,
          "aria-pressed": state.sampleId === sample.id ? "true" : "false"
        });
        button.innerHTML = sample.svg + "<span>" + sample.title + "</span>";
        strip.appendChild(button);
      });
      main.appendChild(strip);
      main.appendChild(el("p", { class: "note", text: "示範相片包括玫瑰、鬱金香、向日葵，以及陷阱：貓、書包、手。模型只「學過」那三種花。" }));

      var result = state.result;
      if (!result) {
        main.appendChild(el("div", { class: "result" }, [
          el("h2", { id: "result-name", text: "還沒有結果" }),
          el("p", { class: "note", text: "揀相後會自動辨識，顯示名稱和信心度。" })
        ]));
        return;
      }

      var name = displayName(result);
      var pct = percents(result.scores);
      var card = el("div", {
        class: "result " + (result.status === "ok" ? "ok" : result.status),
        "aria-live": "polite"
      });
      card.appendChild(el("h2", { id: "result-name", text: name.zh }));
      card.appendChild(el("p", { class: "en", id: "result-en", text: name.en }));
      if (result.status === "unknown") {
        card.appendChild(el("p", { class: "note", id: "result-conf", text: "沒有顯示某種花的百分比。AI 不會說「我不知道」，所以程式要自己判斷陷阱相片。" }));
      } else {
        card.appendChild(el("p", { class: "conf", id: "result-conf", text: pct[0] + "%" }));
        var bar = el("div", { class: "bar" });
        bar.appendChild(el("span", { style: "width:" + Math.max(0, pct[0]) + "%" }));
        card.appendChild(bar);
        if (result.status === "uncertain") {
          card.appendChild(el("p", { class: "note", text: "信心度不夠高，所以顯示「不確定」，不是硬猜第一名。最接近的是 " + PLANTS[result.scores[0][0]].zh + "。" }));
        }
        var list = el("ol", { class: "rank" });
        result.scores.forEach(function (row, index) {
          list.appendChild(el("li", {}, [
            el("span", { text: (index + 1) + ". " + PLANTS[row[0]].zh + " " + row[0] }),
            el("b", { text: pct[index] + "%" })
          ]));
        });
        card.appendChild(el("p", { class: "note", text: "前三名" }));
        card.appendChild(list);
      }
      if (result.status === "ok") {
        var plant = PLANTS[result.scores[0][0]];
        card.appendChild(el("div", { class: "tip" }, [
          el("b", { text: "照顧貼士" }),
          document.createTextNode(plant.tip)
        ]));
      }
      var stack = el("div", { class: "stack" });
      var search = el("button", {
        type: "button",
        class: "btn blue",
        id: "search",
        text: result.status === "unknown" ? "認不到，不搜尋" : (result.status === "uncertain" ? "搜尋最接近的答案" : "Google 搜尋")
      });
      if (result.status === "unknown") search.disabled = true;
      stack.appendChild(search);
      stack.appendChild(el("button", { type: "button", class: "btn ghost", id: "save", text: "儲存到日記" }));
      card.appendChild(stack);
      if (state.savedNote) card.appendChild(el("p", { class: "note", id: "saved-note", text: state.savedNote }));
      var jsonScores = result.scores.map(function (row) {
        return { label: row[0], confidence: Number(row[1].toFixed(2)) };
      });
      var details = el("details");
      details.appendChild(el("summary", { text: "模型答案 JSON（示範）" }));
      details.appendChild(el("pre", { text: JSON.stringify(jsonScores, null, 2) }));
      card.appendChild(details);
      card.appendChild(el("p", { class: "note", text: "畫面上的信心度是百分比，例如 92%。JSON 裡的 confidence 是 0 至 1，例如 0.92。這個網頁只在你的瀏覽器裡做示範，相片不會上傳。" }));
      main.appendChild(card);
    }

    function paintDiary() {
      var main = document.getElementById("main");
      main.textContent = "";
      main.appendChild(el("p", { class: "note", text: "植物日記存在這部瀏覽器裡，重新整理仍會留下。這是示範，不是 iPhone 的真正儲存。" }));
      if (!diary.length) {
        main.appendChild(el("div", { class: "empty", text: "日記是空的。辨識之後可以按「儲存到日記」。" }));
        return;
      }
      diary.forEach(function (item) {
        var row = el("article", { class: "diary-item" }, [
          el("div", {}, [
            el("b", { text: item.label }),
            el("span", { text: item.detail + " · " + item.when })
          ]),
          el("button", { type: "button", class: "btn ghost", "data-remove": item.id, text: "刪除" })
        ]);
        main.appendChild(row);
      });
    }

    function paint() {
      document.getElementById("tab-id").setAttribute("aria-selected", state.tab === "identify" ? "true" : "false");
      document.getElementById("tab-diary").setAttribute("aria-selected", state.tab === "diary" ? "true" : "false");
      if (state.tab === "diary") paintDiary();
      else paintIdentify();
    }

    function showResult(result, photo) {
      state.result = result;
      state.savedNote = "";
      state.sampleId = photo.sampleId || null;
      state.photoHtml = photo.html || "";
      state.photoUrl = photo.url || "";
      state.tab = "identify";
      paint();
    }

    function pickSample(id) {
      var sample = SAMPLES.filter(function (item) { return item.id === id; })[0];
      if (!sample) return;
      showResult(resultFromSample(sample), { sampleId: id, html: sample.svg });
    }

    function onFile(file) {
      if (!file) return;
      if (file.type && file.type.indexOf("image/") !== 0) {
        state.tab = "identify";
        state.result = { status: "unknown", scores: [], fileName: file.name };
        state.photoHtml = "";
        state.photoUrl = "";
        state.sampleId = null;
        state.savedNote = "請選擇相片檔案。";
        paint();
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        showResult(classifyName(file.name, file.size), { url: String(reader.result || "") });
      };
      reader.onerror = function () {
        showResult(classifyName(file.name, file.size), { html: "" });
      };
      reader.readAsDataURL(file);
    }

    function googleSearch() {
      var result = state.result;
      if (!result || result.status === "unknown" || !result.scores.length) return;
      var label = result.scores[0][0];
      var plant = PLANTS[label];
      var q = plant.zh + " " + label + " 植物";
      window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank", "noopener,noreferrer");
    }

    function saveCurrent() {
      if (!state.result) return;
      var name = displayName(state.result);
      var pct = percents(state.result.scores);
      var detail = state.result.status === "unknown"
        ? "認不到"
        : (state.result.status === "uncertain" ? "不確定 · 最接近 " + pct[0] + "%" : name.en + " " + pct[0] + "%");
      var when = new Intl.DateTimeFormat("zh-HK", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).format(new Date());
      diary.unshift({
        id: "d-" + Date.now().toString(36),
        label: name.zh,
        detail: detail,
        when: when
      });
      diary = diary.slice(0, 30);
      saveDiary();
      state.savedNote = "已儲存到日記。";
      paint();
    }

    function bind() {
      document.querySelector(".tabs").addEventListener("click", function (event) {
        var tab = event.target.closest("[data-tab]");
        if (!tab) return;
        state.tab = tab.dataset.tab;
        paint();
      });
      document.getElementById("main").addEventListener("click", function (event) {
        var sample = event.target.closest("[data-sample]");
        if (sample) {
          pickSample(sample.dataset.sample);
          return;
        }
        if (event.target.id === "pick") {
          var input = document.getElementById("file");
          input.value = "";
          input.click();
        }
        if (event.target.id === "search") googleSearch();
        if (event.target.id === "save") saveCurrent();
        var remove = event.target.closest("[data-remove]");
        if (remove) {
          diary = diary.filter(function (item) { return item.id !== remove.dataset.remove; });
          saveDiary();
          paint();
        }
      });
      document.getElementById("file").addEventListener("change", function (event) {
        var file = event.target.files && event.target.files[0];
        if (file) onFile(file);
      });
    }

    loadDiary();
    bind();
    paint();

    window.__demo = {
      pickSample: pickSample,
      classifyName: classifyName,
      percents: percents,
      diary: function () { return diary; }
    };
  </script>
</body>
</html>
